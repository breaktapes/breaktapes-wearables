# Fly.io config for Open Wearables (breaktapes deployment)
# Build context is this dir (backend/). Three process groups share one image:
#   app    — FastAPI (also runs migrations + seeds on boot via app.sh)
#   worker — Celery worker (provider data sync)
#   beat   — Celery beat (periodic sync scheduler)
# Redis is external (Upstash). Postgres is external (Supabase, open_wearables schema).
# svix/flower are NOT deployed — webhooks unused (we poll).

app = "breaktapes-wearables"
primary_region = "fra"  # Frankfurt — closest to Supabase eu-central-1

[build]
  dockerfile = "Dockerfile"

[processes]
  app    = "scripts/start/app.sh"
  worker = "scripts/start/worker.sh"
  beat   = "scripts/start/beat.sh"

[env]
  ENVIRONMENT = "production"
  API_PORT    = "8000"
  DB_PORT     = "5432"
  DB_NAME     = "postgres"
  REDIS_PORT  = "6379"
  # Force OW's tables into the isolated schema + require SSL to Supabase.
  PGOPTIONS   = "-c search_path=open_wearables"
  PGSSLMODE   = "require"
  ENABLE_SVIX = "false"

# Only the app process serves HTTP.
[http_service]
  internal_port      = 8000
  force_https        = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes          = ["app"]

  [http_service.checks]
    [http_service.checks.health]
      method   = "GET"
      path     = "/"
      interval = "30s"
      timeout  = "5s"
      grace_period = "60s"

# Per-process VM sizing.
[[vm]]
  size      = "shared-cpu-1x"
  memory    = "512mb"
  processes = ["app"]

[[vm]]
  size      = "shared-cpu-1x"
  memory    = "512mb"
  processes = ["worker"]

[[vm]]
  size      = "shared-cpu-1x"
  memory    = "256mb"
  processes = ["beat"]
